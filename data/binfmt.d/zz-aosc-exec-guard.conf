# aosc-exec-guard：外来架构 ELF 的 binfmt_misc 规则（装到 /usr/lib/binfmt.d/）。
#
# 规则逐字节抄自 AOSC OS 的 qemu-user 包（/usr/lib/binfmt.d/qemu-*.conf，本机 20 条），
# 只把条目名和解释器换成本程序；以后再想覆盖别的架构，从 qemu 的 conf 照抄一行即可。
#
# 为什么不能只有一条规则：binfmt_misc 一条规则只有一组 magic/mask，匹配是"第一个命中
# 即最终裁决"（不会再退回 binfmt_elf），mask 也只能按位与、表达不了"不等于本机架构"。
# 于是只能一个架构一条规则，用 magic/mask 钉死 ELF 位宽、字节序、e_machine 和
# ET_EXEC|ET_DYN；绝不能让哪条规则匹配本机架构或解释器自身——那会让内核的解释器递归
# 到 ELOOP，全系统都启动不了新程序。
#
# 打包/安装时删掉与目标机器架构相同的那些规则（比如 aarch64 机器上删 -aarch64: 的行）。
:aosc-exec-guard-aarch64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xb7\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/aosc-exec-guard:F
