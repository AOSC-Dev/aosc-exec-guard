# 简体中文文案。键要和 `en.yml` 一样齐（测试会核对），占位符也要一致。
_version: 1

# ---------- 通用 ----------
dialog-title: "无法运行此程序"
list-separator: "、"

# ---------- ELF 解释 ----------
reason-cannot-read: "无法读取该文件"
reason-too-small: "文件太小，不是一个有效的 ELF 可执行文件"
reason-not-elf: "文件不是 ELF 可执行文件"
reason-bad-class: "ELF 头部的位宽字段无法识别"
reason-bad-endian: "ELF 头部的字节序字段无法识别"
reason-read-failed: "读取文件失败"
unknown-machine: "未知架构（e_machine=0x%{machine}）"
arch-sentence: "该程序是为 %{machine}构建的 %{bits} 位程序，而本机是 %{native}"
hint-isolated: "提示：看起来在 chroot / 容器 里（或者看不到 binfmt_misc 注册表）：这里找不到能用的模拟器条目，guard 转不了。如果宿主机装了 qemu-user：到外面（宿主机）上运行 `sudo aosc-exec-guard --handover`，让 guard 退出、由内核的 qemu 条目接管——qemu 条目用 F 直接打开宿主机的解释器，chroot / 容器 里不需要放 qemu。"
hint-install-emulator: "提示：可以安装对应架构的模拟器（qemu-user-static、box64 等）后重试，或改用 AOSC OS 原生版本。"
hint-emulator-installed: "提示：本机已安装 %{entry}，设置 AOSC_EXEC_GUARD_QEMU=always 可让它自动运行（ask=每次询问、never=从不运行）。"
cannot-run: "无法运行“%{path}”：%{why}。\n%{hint}"
native-but-rejected: "无法运行“%{path}”：程序架构与本机一致（%{machine}），但内核拒绝了它，文件可能已损坏或格式不受支持。"
cannot-run-notelf: "无法运行“%{path}”：%{why}。"
cannot-start: "无法启动 %{entry}"
cannot-remember: "无法记住“不再询问”的选择"

# ---------- 询问 ----------
qemu-question: "“%{path}”不能在本机直接运行：%{sentence}。"
run-with-prompt: "用 %{entry} 运行吗"
menu-run-once: "运行（这次）"
menu-decline: "不运行（这次）"
menu-always: "总是运行（不再询问）"
run-label: "运行"
decline-label: "不运行"
dont-ask-again: "不再询问"

# ---------- --handover ----------
ho-no-qemu-warning: "警告：注册表里没有已启用的 qemu-* 条目——让位后外架构程序会直接以 `Exec format error` 失败（没人解释，也没人模拟）。"
ho-question: "让 guard 退出（注销它的 binfmt 条目、停用配置文件），外架构程序改由内核的 qemu 条目直接处理？"
ho-question-no-qemu: "让 guard 退出（注销它的 binfmt 条目、停用配置文件）？注意：注册表里没有可用的 qemu 条目。"
cancelled: "已取消，什么都没改。"
ho-done: "让位完成：外架构程序现在由内核的 qemu 条目处理（宿主机、chroot、容器 都一样）。"
ho-restore-hint: "恢复：`sudo aosc-exec-guard --handover=off`，或重新运行安装脚本。"
ho-nothing-installed: "没找到 guard 的 binfmt 条目，也没找到配置文件（%{conf_name}）：像是没装，无需让位。"
ho-already: "guard 已经处于让位状态（%{conf_name}%{suffix} 还在）；要恢复用 `--handover=off`。"
ho-no-conf-notice: "提醒：没找到配置文件（%{conf_name}），只注销当前条目；如果它是别的方式注册的，重启后可能回来。"
ho-disable-failed: "停用 %{path} 失败（需要 root？）"
ho-disabled: "已停用 %{path}"
ho-unregister-failed: "注销条目 %{name} 失败（需要 root？）"
ho-unregistered: "已注销条目 %{name}"
ho-residue: "注销之后还有残留条目：%{list}"
tb-question: "恢复 guard：把配置文件改回来，并重新注册它的 binfmt 条目？"
tb-not-handed: "没有找到停用的配置文件（%{conf_name}%{suffix}）：当前不在让位状态。"
tb-test-mode: "（测试模式：不重启 systemd-binfmt；条目会在重启或重装时回来。）"
tb-restore-failed: "恢复 %{path} 失败（需要 root？）"
tb-restored: "已恢复 %{path}"
tb-done: "已恢复：guard 条目回来了（%{count} 个）。"
tb-verify-failed: "配置文件已恢复，但注册表里还没看到 guard 条目：看看 `systemctl status systemd-binfmt.service`。"
ctx-chroot: "看起来在 chroot 里：注册表属于宿主机、配置文件属于 chroot，请在宿主机（外面）上运行。"
ctx-container: "看起来在容器里（嵌套的 PID namespace）：请在宿主机（外面）上运行。"
ctx-no-registry: "看不到 binfmt_misc 注册表：请在宿主机（外面）上运行。"
confirm-needs-tty: "需要确认，但这里没有终端：请加 --yes（或到终端里运行）。"
confirm-failed: "询问失败"
restart-failed: "没法运行 systemctl；请手动 `systemctl restart systemd-binfmt.service` 重启"
restart-status-failed: "`systemctl restart systemd-binfmt.service` 失败：请手动重启后再看。"

# ---------- 用户配置文件 ----------
no-config-dir: "无法定位用户配置目录（HOME / XDG_CONFIG_HOME）"
cannot-write-config: "写 %{path} 失败"
user-config-content: "# aosc-exec-guard 用户设置（“不再询问”时写入）\n# qemu: ask=每次询问（默认）/ always=总是用仿真器运行 / never=从不运行\nqemu = %{value}\n"

# ---------- 命令行 / --help（由 main.rs 的 clap 属性在运行时取用）----------
cli-about: "说明一个程序为何无法在本机运行（binfmt_misc 解释器）。"
cli-usage: "aosc-exec-guard [选项] <程序路径> [参数…]"
cli-help-template: "{before-help}{about-with-newline}\n用法: {usage}\n\n{all-args}{after-help}"
cli-arguments-heading: "参数"
cli-options-heading: "选项"
cli-after-help: "（通常由内核通过 binfmt_misc 调用，无需手动运行；`--handover` 例外——要手动以 root 运行。）"
cli-path-value: "程序路径"
cli-mode-value: "模式"
cli-action-value: "动作"
cli-path-help: "无法运行的程序路径（其后的参数原属于原程序）"
cli-no-dialog-help: "永远不弹框（相当于 AOSC_EXEC_GUARD_NO_DIALOG=1）"
cli-debug-help: "打印模式判定等调试信息（含 binfmt 注册表可见性；相当于 AOSC_EXEC_GUARD_DEBUG=1）"
cli-qemu-help: "检测到 qemu-user 仿真器时怎么办（环境变量 AOSC_EXEC_GUARD_QEMU；默认读保存过的选择）"
cli-handover-help: "让 guard 退出、把外架构程序交给内核的 qemu 条目（--handover=off 恢复）"
cli-yes-help: "跳过确认询问（非交互环境必须加；只对 --handover 有意义）"
cli-help-help: "显示帮助信息"
cli-version-help: "显示版本号"
