# rustup 读这个文件：stable 工具链 + 构建要用的 musl 标准库。
# 项目只有全静态构建（见 justfile 的 build / README「构建」）：有对应 triple 的
# musl std 就走 musl，没有才退回 glibc + crt-static。这里把常用宿主机架构都列上，
# 换台机器（aarch64 / riscv64 / loongarch64）也不用再手工 rustup target add。
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]   # just check 要用
targets = [
    "x86_64-unknown-linux-musl",      # amd64
    "aarch64-unknown-linux-musl",     # arm64
    "riscv64gc-unknown-linux-musl",   # riscv64
    "loongarch64-unknown-linux-musl", # loongarch64
]
